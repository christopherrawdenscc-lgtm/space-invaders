<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invaders</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      background-color: #000;
      border: 1px solid #333;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 30px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="game-over">GAME OVER</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const gameOverElement = document.getElementById('game-over');

    // Canvas dimensions
    canvas.width = 800;
    canvas.height = 600;

    // Pixel-art sprites: each 'X' is one pixel, drawn PIXEL x PIXEL in size
    const PIXEL = 4;
    const SPRITES = {
      player: [
        '......X......',
        '.....XXX.....',
        '.....XXX.....',
        '.XXXXXXXXXXX.',
        'XXXXXXXXXXXXX',
        'XXXXXXXXXXXXX',
        'XXXXXXXXXXXXX',
        'XXXXXXXXXXXXX',
      ],
      // Each invader has two animation frames
      squid: [
        [
          '...XX...',
          '..XXXX..',
          '.XXXXXX.',
          'XX.XX.XX',
          'XXXXXXXX',
          '..X..X..',
          '.X.XX.X.',
          'X.X..X.X',
        ],
        [
          '...XX...',
          '..XXXX..',
          '.XXXXXX.',
          'XX.XX.XX',
          'XXXXXXXX',
          '.X.XX.X.',
          'X......X',
          '.X....X.',
        ],
      ],
      crab: [
        [
          '..X.....X..',
          '...X...X...',
          '..XXXXXXX..',
          '.XX.XXX.XX.',
          'XXXXXXXXXXX',
          'X.XXXXXXX.X',
          'X.X.....X.X',
          '...XX.XX...',
        ],
        [
          '..X.....X..',
          'X..X...X..X',
          'X.XXXXXXX.X',
          'XXX.XXX.XXX',
          'XXXXXXXXXXX',
          '.XXXXXXXXX.',
          '..X.....X..',
          '.X.......X.',
        ],
      ],
      octopus: [
        [
          '....XXXX....',
          '.XXXXXXXXXX.',
          'XXXXXXXXXXXX',
          'XXX..XX..XXX',
          'XXXXXXXXXXXX',
          '...XX..XX...',
          '..XX.XX.XX..',
          'XX........XX',
        ],
        [
          '....XXXX....',
          '.XXXXXXXXXX.',
          'XXXXXXXXXXXX',
          'XXX..XX..XXX',
          'XXXXXXXXXXXX',
          '..XXX..XXX..',
          '.XX..XX..XX.',
          '..XX....XX..',
        ],
      ],
    };

    function drawSprite(sprite, x, y, color) {
      ctx.fillStyle = color;
      sprite.forEach((row, py) => {
        for (let px = 0; px < row.length; px++) {
          if (row[px] === 'X') {
            ctx.fillRect(x + px * PIXEL, y + py * PIXEL, PIXEL, PIXEL);
          }
        }
      });
    }

    // Scrolling starfield background (3 layers: far stars are small, dim and slow)
    const stars = [];
    const starLayers = [
      { count: 80, size: 1, speed: 0.3, color: '#555555' },
      { count: 40, size: 2, speed: 0.8, color: '#aaaaaa' },
      { count: 15, size: 3, speed: 1.6, color: '#ffffff' },
    ];
    starLayers.forEach(layer => {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: layer.size,
          speed: layer.speed,
          color: layer.color,
        });
      }
    });

    function moveStars() {
      stars.forEach(star => {
        star.y += star.speed;
        // Wrap back to the top at a new random x
        if (star.y > canvas.height) {
          star.y = -star.size;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function drawStars() {
      stars.forEach(star => {
        ctx.fillStyle = star.color;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
    }

    // Animation frame counter (invaders flip between their two frames)
    let frameCount = 0;
    const animationSpeed = 30; // Frames between each flip

    // Player
    const player = {
      x: canvas.width / 2 - (13 * PIXEL) / 2,
      y: canvas.height - 60,
      width: 13 * PIXEL,
      height: 8 * PIXEL,
      color: '#00ff00',
      speed: 5,
      dx: 0,
    };

    // Player shooting
    const bullets = [];
    const bulletSpeed = 7;

    // Enemies
    const enemies = [];
    const enemyColumns = 4; // 4 columns x 5 rows = 20 invaders
    const columnSpacing = 64;
    const rowSpacing = 50;
    const enemySpeed = 2;
    let enemyDirection = 1; // Whole formation moves together: 1 = right, -1 = left
    // Invader type for each row, top to bottom (like the arcade game)
    const rowTypes = ['squid', 'crab', 'crab', 'octopus', 'octopus'];
    const typeColors = { squid: '#ff66ff', crab: '#66ccff', octopus: '#ffffff' };

    const enemyDrop = 20; // How far enemies move down each time they hit an edge

    // Initialize enemies
    function spawnEnemies() {
      enemies.length = 0;
      enemyDirection = 1;
      const widestInvader = 12 * PIXEL; // Octopus is the widest sprite
      for (let row = 0; row < rowTypes.length; row++) {
        const type = rowTypes[row];
        const width = SPRITES[type][0][0].length * PIXEL;
        for (let col = 0; col < enemyColumns; col++) {
          enemies.push({
            type: type,
            // Center narrower invaders in their column so the grid lines up
            x: 50 + col * columnSpacing + (widestInvader - width) / 2,
            y: 50 + row * rowSpacing,
            width: width,
            height: 8 * PIXEL,
            color: typeColors[type],
            row: row,
          });
        }
      }
    }
    spawnEnemies();

    // Score
    let score = 0;
    let gameOver = false;

    // Keyboard keys
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Move player
    function movePlayer() {
      if (keys['ArrowLeft']) {
        player.dx = -player.speed;
      } else if (keys['ArrowRight']) {
        player.dx = player.speed;
      } else {
        player.dx = 0;
      }

      player.x += player.dx;
      // Keep the ship on screen
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    }

    // Fire bullet
    function fireBullet() {
      if (keys['Space']) {
        bullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y,
          width: 4,
          height: 10,
          color: '#ffffff',
        });
        keys['Space'] = false;
      }
    }

    // Move enemies
    function moveEnemies() {
      // Move the whole formation sideways
      let hitEdge = false;
      enemies.forEach(enemy => {
        enemy.x += enemySpeed * enemyDirection;
        if (enemy.x < 0 || enemy.x + enemy.width > canvas.width) {
          hitEdge = true;
        }
      });

      // If any invader touched an edge, step everyone back, turn around and drop down
      if (hitEdge) {
        enemies.forEach(enemy => {
          enemy.x -= enemySpeed * enemyDirection;
          enemy.y += enemyDrop;
        });
        enemyDirection *= -1;
      }

      enemies.forEach(enemy => {
        // Game over if an enemy reaches the player's row
        if (enemy.y + enemy.height >= player.y) {
          gameOver = true;
          gameOverElement.style.display = 'block';
        }
      });

      // Send a new wave once every enemy is destroyed
      if (enemies.length === 0) {
        spawnEnemies();
      }
    }

    // Shoot bullets
    function shootBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bulletSpeed;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
        }
      }
    }

    // Check collision between player and enemies
    function checkCollision() {
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          gameOver = true;
          gameOverElement.style.display = 'block';
        }

        // Check if any bullet hits the enemy
        for (let j = 0; j < bullets.length; j++) {
          const bullet = bullets[j];
          if (
            bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y
          ) {
            // Hit enemy
            score += 10;
            scoreElement.innerText = `Score: ${score}`;
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }
      }
    }

    // Draw functions
    function drawPlayer() {
      drawSprite(SPRITES.player, player.x, player.y, player.color);
    }

    function drawBullets() {
      ctx.fillStyle = '#ffffff';
      bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      });
    }

    function drawEnemies() {
      const frame = Math.floor(frameCount / animationSpeed) % 2;
      enemies.forEach(enemy => {
        drawSprite(SPRITES[enemy.type][frame], enemy.x, enemy.y, enemy.color);
      });
    }

    function drawScore() {
      ctx.fillStyle = 'white';
      ctx.font = '20px Arial';
      ctx.fillText(`Score: ${score}`, 10, 30);
    }

    function drawGameOver() {
      ctx.fillStyle = 'red';
      ctx.font = '30px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2 - 100, canvas.height / 2);
    }

    // Game loop
    function gameLoop() {
      if (gameOver) {
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      moveStars();
      drawStars();

      movePlayer();
      fireBullet();
      moveEnemies();
      shootBullets();
      checkCollision();

      drawPlayer();
      drawBullets();
      drawEnemies();

      requestAnimationFrame(gameLoop);
    }

    // Start game
    gameLoop();

    // Handle restart
    gameOverElement.addEventListener('click', () => {
      gameOver = false;
      score = 0;
      player.x = canvas.width / 2 - player.width / 2;
      player.dx = 0;
      bullets.length = 0;
      spawnEnemies();
      gameOverElement.style.display = 'none';
      scoreElement.innerText = `Score: ${score}`;
      gameLoop();
    });
  </script>
</body>
</html>
