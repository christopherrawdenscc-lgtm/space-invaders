<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invaders</title>
  <style>
    /* ===== PAGE LAYOUT: black page with the game canvas centred ===== */
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    /* ===== GAME CANVAS: the play area everything is drawn on ===== */
    canvas {
      background-color: #000;
      border: 1px solid #333;
    }
    /* ===== HUD: score and lives in the top-left corner ===== */
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
    }
    /* ===== GAME OVER MESSAGE: hidden until the game ends; click it to restart ===== */
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 30px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- HUD text, the game over message and the canvas the game is drawn on -->
  <div id="score">Score: 0</div>
  <div id="game-over">GAME OVER</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    // =====================================================================
    // SETUP: grab the canvas, its drawing context and the HUD elements
    // =====================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const gameOverElement = document.getElementById('game-over');

    // Canvas dimensions
    canvas.width = 800;
    canvas.height = 600;

    // =====================================================================
    // SPRITES: detailed, multi-coloured pixel art for the ship and invaders
    // =====================================================================
    // Each character is one pixel, SPRITE_PIXEL x SPRITE_PIXEL in size.
    // '.' is transparent; every other letter is looked up in the sprite's palette:
    //   L = light edge, B = body, D = shadow, T = legs/tentacles, E = eyes, W = eye sparkle
    const SPRITE_PIXEL = 2;
    // Shields are built from chunkier PIXEL x PIXEL blocks
    const PIXEL = 4;

    const PALETTES = {
      player: {
        W: '#ffffff', // Nose tip and canopy glint
        C: '#66e0ff', // Cockpit glass
        S: '#b8c4d0', // Silver cannons and nose cone
        L: '#9dff9d', // Light edges of the hull
        G: '#22cc44', // Hull
        g: '#127a2a', // Hull shadow
        Y: '#ffd23f', // Running lights
        R: '#ff4a2e', // Cannon tips and engine flames
      },
      squid:   { L: '#ffc2ff', B: '#ff4fd8', D: '#a3219a', T: '#c27dff', E: '#fff36b', W: '#ffffff' },
      crab:    { L: '#bdf0ff', B: '#33b5ff', D: '#1a6fb0', T: '#4ce0c0', E: '#ff4d6d', W: '#ffffff' },
      octopus: { L: '#e0ffb8', B: '#7ddc3a', D: '#3f8a1c', T: '#ffc53d', E: '#ff3b5c', W: '#ffffff' },
    };

    const SPRITE_ART = {
      player: [
        '............WW............',
        '...........WCCW...........',
        '...........SCCS...........',
        '..........SSCCSS..........',
        '..........SSSSSS..........',
        '.........LGGSSGGL.........',
        '....R...LGGGGGGGGL...R....',
        '...SRS.LGGGGGGGGGGL.SRS...',
        '...SSSLGGGGWWWWGGGGLSSS...',
        '..LGGGGGGGGGGGGGGGGGGGGL..',
        '.LGGGGGGGGGGGGGGGGGGGGGGL.',
        'gGGGGGGYYGGGGGGGGYYGGGGGGg',
        'gGGGGGGGGGGGGGGGGGGGGGGGGg',
        'gggggggggggggggggggggggggg',
        '...RYR..............RYR...',
        '....R................R....',
      ],
      // Each invader has two animation frames
      squid: [
        [
          '......LLLL......',
          '......BBBB......',
          '....LLBBBBLL....',
          '....BBBBBBBB....',
          '..LLBBBBBBBBLL..',
          '..BBBBBBBBBBBB..',
          'LLBBWEBBBBWEBBLL',
          'BBBBEEBBBBEEBBBB',
          'BBBBBBBBBBBBBBBB',
          'DDDDDDDDDDDDDDDD',
          '....TT....TT....',
          '....TT....TT....',
          '..TT..TTTT..TT..',
          '..TT..TTTT..TT..',
          'TT..TT....TT..TT',
          'TT..TT....TT..TT',
        ],
        [
          '......LLLL......',
          '......BBBB......',
          '....LLBBBBLL....',
          '....BBBBBBBB....',
          '..LLBBBBBBBBLL..',
          '..BBBBBBBBBBBB..',
          'LLBBWEBBBBWEBBLL',
          'BBBBEEBBBBEEBBBB',
          'BBBBBBBBBBBBBBBB',
          'DDDDDDDDDDDDDDDD',
          '..TT..TTTT..TT..',
          '..TT..TTTT..TT..',
          'TT............TT',
          'TT............TT',
          '..TT........TT..',
          '..TT........TT..',
        ],
      ],
      crab: [
        [
          '....EE..........EE....',
          '....EE..........EE....',
          '......LL......LL......',
          '......BB......BB......',
          '....LLBBLLLLLLBBLL....',
          '....BBBBBBBBBBBBBB....',
          '..LLBBWEBBBBBBWEBBLL..',
          '..BBBBEEBBBBBBEEBBBB..',
          'LLBBBBBBBBBBBBBBBBBBLL',
          'BBDDBBBBBBBBBBBBBBDDBB',
          'BB..BBBBBBBBBBBBBB..BB',
          'DD..DDDDDDDDDDDDDD..DD',
          'TT..TT..........TT..TT',
          'TT..TT..........TT..TT',
          '......TTTT..TTTT......',
          '......TTTT..TTTT......',
        ],
        [
          '....EE..........EE....',
          '....EE..........EE....',
          'LL....LL......LL....LL',
          'BB....BB......BB....BB',
          'BB..LLBBLLLLLLBBLL..BB',
          'BB..BBBBBBBBBBBBBB..BB',
          'BBLLBBWEBBBBBBWEBBLLBB',
          'BBBBBBEEBBBBBBEEBBBBBB',
          'BBBBBBBBBBBBBBBBBBBBBB',
          'DDBBBBBBBBBBBBBBBBBBDD',
          '..BBBBBBBBBBBBBBBBBB..',
          '..DDDDDDDDDDDDDDDDDD..',
          '....TT..........TT....',
          '....TT..........TT....',
          '..TT..............TT..',
          '..TT..............TT..',
        ],
      ],
      octopus: [
        [
          '........LLLLLLLL........',
          '........BBBBBBBB........',
          '..LLLLLLBBBBBBBBLLLLLL..',
          '..BBBBBBBBBBBBBBBBBBBB..',
          'LLBBBBBBBBBBBBBBBBBBBBLL',
          'BBBBBBBBBBBBBBBBBBBBBBBB',
          'BBBBBBWEEEBBBBWEEEBBBBBB',
          'BBBBBBEEEEBBBBEEEEBBBBBB',
          'BBBBBBBBBBBBBBBBBBBBBBBB',
          'DDDDDDDDDDDDDDDDDDDDDDDD',
          '......TTTT....TTTT......',
          '......TTTT....TTTT......',
          '....TTTT..TTTT..TTTT....',
          '....TTTT..TTTT..TTTT....',
          'TTTT................TTTT',
          'TTTT................TTTT',
        ],
        [
          '........LLLLLLLL........',
          '........BBBBBBBB........',
          '..LLLLLLBBBBBBBBLLLLLL..',
          '..BBBBBBBBBBBBBBBBBBBB..',
          'LLBBBBBBBBBBBBBBBBBBBBLL',
          'BBBBBBBBBBBBBBBBBBBBBBBB',
          'BBBBBBWEEEBBBBWEEEBBBBBB',
          'BBBBBBEEEEBBBBEEEEBBBBBB',
          'BBBBBBBBBBBBBBBBBBBBBBBB',
          'DDDDDDDDDDDDDDDDDDDDDDDD',
          '....TTTTTT....TTTTTT....',
          '....TTTTTT....TTTTTT....',
          '..TTTT....TTTT....TTTT..',
          '..TTTT....TTTT....TTTT..',
          '....TTTT........TTTT....',
          '....TTTT........TTTT....',
        ],
      ],
    };

    // Paint a sprite's rows onto its own small canvas once, so each frame
    // only has to copy the finished picture instead of redrawing every pixel
    function renderSprite(rows, palette) {
      const image = document.createElement('canvas');
      image.width = rows[0].length * SPRITE_PIXEL;
      image.height = rows.length * SPRITE_PIXEL;
      const imageCtx = image.getContext('2d');
      rows.forEach((row, py) => {
        for (let px = 0; px < row.length; px++) {
          const color = palette[row[px]];
          if (color) {
            imageCtx.fillStyle = color;
            imageCtx.fillRect(px * SPRITE_PIXEL, py * SPRITE_PIXEL, SPRITE_PIXEL, SPRITE_PIXEL);
          }
        }
      });
      return image;
    }

    // Pre-rendered sprites: SPRITES.player, and two frames for each invader type
    const SPRITES = {
      player: renderSprite(SPRITE_ART.player, PALETTES.player),
    };
    ['squid', 'crab', 'octopus'].forEach(type => {
      SPRITES[type] = SPRITE_ART[type].map(frame => renderSprite(frame, PALETTES[type]));
    });

    // Draw a pre-rendered sprite with its top-left corner at (x, y)
    function drawSprite(sprite, x, y) {
      ctx.drawImage(sprite, x, y);
    }

    // =====================================================================
    // BACKGROUND IMAGERY: deep-space scene drawn behind the stars
    // =====================================================================
    // Each layer is painted once onto its own hidden canvas at start-up,
    // then copied every frame (much faster than redrawing all the detail)
    function makeLayer(width, height) {
      const layer = document.createElement('canvas');
      layer.width = width;
      layer.height = height;
      return layer;
    }

    // Fill a soft glowing circle that fades out to nothing at its edge
    function paintGlow(g, x, y, radius, rgb, alpha) {
      const glow = g.createRadialGradient(x, y, 0, x, y, radius);
      glow.addColorStop(0, `rgba(${rgb}, ${alpha})`);
      glow.addColorStop(0.5, `rgba(${rgb}, ${alpha * 0.4})`);
      glow.addColorStop(1, `rgba(${rgb}, 0)`);
      g.fillStyle = glow;
      g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    // --- Sky: dark gradient, Milky Way band and a distant spiral galaxy (never moves)
    const skyLayer = makeLayer(canvas.width, canvas.height);

    function paintSky() {
      const g = skyLayer.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const sky = g.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#03020c');
      sky.addColorStop(0.6, '#0a0820');
      sky.addColorStop(1, '#150b28');
      g.fillStyle = sky;
      g.fillRect(0, 0, w, h);

      // Milky Way: a soft diagonal band of glow sprinkled with faint dust
      for (let i = 0; i < 14; i++) {
        const t = i / 13;
        paintGlow(g, t * w, h * 0.85 - t * h * 0.7, 110, '150, 130, 255', 0.07);
      }
      for (let i = 0; i < 1400; i++) {
        const t = Math.random();
        const spread = (Math.random() + Math.random() + Math.random() - 1.5) * 70;
        g.fillStyle = `rgba(220, 215, 255, ${0.1 + Math.random() * 0.35})`;
        g.fillRect(t * w + spread * 0.6, h * 0.85 - t * h * 0.7 + spread, 1, 1);
      }

      // Spiral galaxy: a glowing core with two tilted arms of stars
      const cx = w * 0.82;
      const cy = h * 0.2;
      paintGlow(g, cx, cy, 30, '255, 230, 200', 0.5);
      for (let arm = 0; arm < 2; arm++) {
        for (let i = 0; i < 350; i++) {
          const angle = i * 0.045 + arm * Math.PI;
          const r = 3 + i * 0.12 + Math.random() * 3;
          g.fillStyle = `rgba(200, 190, 255, ${0.6 * (1 - i / 350)})`;
          g.fillRect(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r * 0.45, 1, 1);
        }
      }
    }

    // --- Nebula: coloured gas clouds that drift down very slowly and wrap around
    const nebulaLayer = makeLayer(canvas.width, canvas.height);
    const nebulaSpeed = 0.15;
    let nebulaOffset = 0;

    function paintNebula() {
      const g = nebulaLayer.getContext('2d');
      const colors = ['255, 60, 160', '60, 200, 255', '150, 80, 255', '255, 140, 60'];
      for (let i = 0; i < 10; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const radius = 80 + Math.random() * 120;
        const rgb = colors[i % colors.length];
        // Paint copies above and below so the layer tiles seamlessly as it scrolls
        [-canvas.height, 0, canvas.height].forEach(shift => {
          paintGlow(g, x, y + shift, radius, rgb, 0.16);
        });
      }
    }

    // --- Planets: pre-painted worlds that drift past at different speeds
    // Light comes from the top-left; ringed planets get a tilted ring around them
    function paintPlanet(radius, look) {
      const ringWidth = look.ring ? radius * 2.3 : radius;
      const image = makeLayer(Math.ceil(ringWidth * 2 + 8), Math.ceil(radius * 2 + 8));
      const g = image.getContext('2d');
      const cx = image.width / 2;
      const cy = image.height / 2;

      // Back half of the ring (behind the planet)
      if (look.ring) {
        g.strokeStyle = look.ring;
        g.lineWidth = radius * 0.18;
        g.beginPath();
        g.ellipse(cx, cy, radius * 2, radius * 0.45, -0.25, Math.PI, Math.PI * 2);
        g.stroke();
      }

      // The planet's surface, clipped to a circle
      g.save();
      g.beginPath();
      g.arc(cx, cy, radius, 0, Math.PI * 2);
      g.clip();
      g.fillStyle = look.base;
      g.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

      // Cloud bands (gas giants)
      if (look.bands) {
        let y = cy - radius;
        let band = 0;
        while (y < cy + radius) {
          const height = 3 + Math.random() * 6;
          g.fillStyle = look.bands[band % look.bands.length];
          g.globalAlpha = 0.6;
          g.fillRect(cx - radius, y, radius * 2, height);
          y += height + 2 + Math.random() * 5;
          band++;
        }
        g.globalAlpha = 1;
      }

      // Craters (moons)
      if (look.craters) {
        for (let i = 0; i < 9; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * radius * 0.8;
          const size = 1 + Math.random() * radius * 0.22;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          g.fillStyle = 'rgba(0, 0, 0, 0.3)';
          g.beginPath();
          g.arc(x, y, size, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = 'rgba(255, 255, 255, 0.15)';
          g.beginPath();
          g.arc(x + size * 0.3, y + size * 0.3, size * 0.6, 0, Math.PI * 2);
          g.fill();
        }
      }

      // Shading: bright where the light hits, dark on the far side
      const shade = g.createRadialGradient(cx - radius * 0.4, cy - radius * 0.4, radius * 0.1, cx, cy, radius * 1.05);
      shade.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
      shade.addColorStop(0.45, 'rgba(0, 0, 0, 0)');
      shade.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
      g.fillStyle = shade;
      g.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
      g.restore();

      // Thin glowing atmosphere around the edge
      g.strokeStyle = look.glow;
      g.lineWidth = 2;
      g.beginPath();
      g.arc(cx, cy, radius, 0, Math.PI * 2);
      g.stroke();

      // Front half of the ring (in front of the planet)
      if (look.ring) {
        g.strokeStyle = look.ring;
        g.lineWidth = radius * 0.18;
        g.beginPath();
        g.ellipse(cx, cy, radius * 2, radius * 0.45, -0.25, 0, Math.PI);
        g.stroke();
      }
      return image;
    }

    const planets = [];

    function createPlanets() {
      const looks = [
        // Ringed gas giant
        { radius: 48, x: 90, y: 140, speed: 0.22,
          look: { base: '#c9a26b', bands: ['#a67c45', '#e3c48f', '#8a5f32'], ring: 'rgba(230, 210, 170, 0.75)', glow: 'rgba(255, 220, 160, 0.5)' } },
        // Blue ice giant
        { radius: 32, x: 360, y: -260, speed: 0.3,
          look: { base: '#3f7fd9', bands: ['#2d5fae', '#6fb0ff'], glow: 'rgba(120, 190, 255, 0.6)' } },
        // Small red planet
        { radius: 20, x: 660, y: 360, speed: 0.36,
          look: { base: '#b8452e', bands: ['#8e2f1f', '#d8664a'], glow: 'rgba(255, 120, 90, 0.5)' } },
        // Cratered moon
        { radius: 12, x: 470, y: 80, speed: 0.42,
          look: { base: '#9aa0aa', craters: true, glow: 'rgba(200, 210, 255, 0.4)' } },
      ];
      looks.forEach(p => {
        planets.push({ image: paintPlanet(p.radius, p.look), x: p.x, y: p.y, speed: p.speed });
      });
    }

    // --- Home planet: a huge night-side world curving along the bottom edge
    const horizonLayer = makeLayer(canvas.width, canvas.height);

    function paintHorizon() {
      const g = horizonLayer.getContext('2d');
      const radius = 960;
      const cx = canvas.width / 2;
      const cy = canvas.height + 900; // Only the top of the curve is on screen

      // Atmosphere glow hugging the curve
      g.strokeStyle = 'rgba(70, 160, 255, 0.12)';
      g.lineWidth = 30;
      g.beginPath();
      g.arc(cx, cy, radius + 8, 0, Math.PI * 2);
      g.stroke();
      g.strokeStyle = 'rgba(120, 200, 255, 0.35)';
      g.lineWidth = 4;
      g.beginPath();
      g.arc(cx, cy, radius, 0, Math.PI * 2);
      g.stroke();

      // Dark surface
      const surface = g.createLinearGradient(0, cy - radius, 0, canvas.height);
      surface.addColorStop(0, '#0c2438');
      surface.addColorStop(1, '#030a12');
      g.fillStyle = surface;
      g.beginPath();
      g.arc(cx, cy, radius, 0, Math.PI * 2);
      g.fill();

      // Twinkling city lights scattered over the night side
      for (let i = 0; i < 90; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.9;
        const depth = 6 + Math.random() * 50;
        const x = cx + Math.cos(angle) * (radius - depth);
        const y = cy + Math.sin(angle) * (radius - depth);
        g.fillStyle = Math.random() < 0.7 ? 'rgba(255, 210, 110, 0.7)' : 'rgba(255, 255, 220, 0.9)';
        g.fillRect(x, y, Math.random() < 0.2 ? 2 : 1, 1);
      }
    }

    // --- Shooting stars: occasional bright streaks across the sky
    const shootingStars = [];
    const shootingStarChance = 0.004; // Chance per frame of a new one

    paintSky();
    paintNebula();
    createPlanets();
    paintHorizon();

    // Scroll the nebula and planets, and launch/move shooting stars
    function moveBackground() {
      nebulaOffset = (nebulaOffset + nebulaSpeed) % canvas.height;

      planets.forEach(planet => {
        planet.y += planet.speed;
        // Once it has drifted off the bottom, send it round again from above
        if (planet.y > canvas.height) {
          planet.y = -planet.image.height - Math.random() * 400;
          planet.x = Math.random() * (canvas.width - planet.image.width);
        }
      });

      if (Math.random() < shootingStarChance) {
        const direction = Math.random() < 0.5 ? -1 : 1;
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.5,
          dx: direction * (6 + Math.random() * 4),
          dy: 2 + Math.random() * 2,
          life: 50,
          maxLife: 50,
        });
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const star = shootingStars[i];
        star.x += star.dx;
        star.y += star.dy;
        star.life--;
        if (star.life <= 0) {
          shootingStars.splice(i, 1);
        }
      }
    }

    // Paint the far layers: sky, nebula, planets and shooting stars
    function drawBackground() {
      ctx.drawImage(skyLayer, 0, 0);

      // Nebula is drawn twice, one copy above the other, so it wraps seamlessly
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(nebulaLayer, 0, nebulaOffset);
      ctx.drawImage(nebulaLayer, 0, nebulaOffset - canvas.height);
      ctx.globalCompositeOperation = 'source-over';

      ctx.globalAlpha = 0.85; // Keep planets slightly muted so the action stands out
      planets.forEach(planet => ctx.drawImage(planet.image, planet.x, planet.y));
      ctx.globalAlpha = 1;

      ctx.lineWidth = 2;
      shootingStars.forEach(star => {
        const fade = star.life / star.maxLife;
        const tailX = star.x - star.dx * 6;
        const tailY = star.y - star.dy * 6;
        const trail = ctx.createLinearGradient(star.x, star.y, tailX, tailY);
        trail.addColorStop(0, `rgba(255, 255, 255, ${fade})`);
        trail.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.strokeStyle = trail;
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      });
    }

    // Paint the home planet in front of the stars (behind the player and shields)
    function drawHorizon() {
      ctx.drawImage(horizonLayer, 0, 0);
    }

    // =====================================================================
    // STARFIELD: scrolling background (3 layers: far stars are small, dim and slow)
    // =====================================================================
    const stars = [];
    const starLayers = [
      { count: 80, size: 1, speed: 0.3, color: '#555555' },
      { count: 40, size: 2, speed: 0.8, color: '#aaaaaa' },
      { count: 15, size: 3, speed: 1.6, color: '#ffffff' },
    ];
    starLayers.forEach(layer => {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: layer.size,
          speed: layer.speed,
          color: layer.color,
          twinkle: Math.random() * Math.PI * 2, // Each star twinkles out of step
        });
      }
    });

    // Scroll every star down the screen at its layer's speed
    function moveStars() {
      stars.forEach(star => {
        star.y += star.speed;
        // Wrap back to the top at a new random x
        if (star.y > canvas.height) {
          star.y = -star.size;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    // Paint every star as a small square that gently twinkles
    function drawStars() {
      stars.forEach(star => {
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(frameCount * 0.06 + star.twinkle);
        ctx.fillStyle = star.color;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
      ctx.globalAlpha = 1;
    }

    // =====================================================================
    // ANIMATION: frame counter used to flip invaders between their two frames
    // =====================================================================
    let frameCount = 0;
    const animationSpeed = 30; // Frames between each flip

    // =====================================================================
    // PLAYER: the ship's position, size and speed (size comes from its sprite)
    // =====================================================================
    const player = {
      x: canvas.width / 2 - SPRITES.player.width / 2,
      y: canvas.height - 60,
      width: SPRITES.player.width,
      height: SPRITES.player.height,
      speed: 5,
      dx: 0,
    };

    // =====================================================================
    // BULLET SETTINGS: player shots (upwards) and enemy shots (downwards)
    // =====================================================================
    // Player shooting
    const bullets = [];
    const bulletSpeed = 7;

    // Enemy shooting
    const enemyBullets = [];
    const enemyBulletSpeed = 4;
    const enemyFireChance = 0.02; // Chance per frame that the formation fires
    const maxEnemyBullets = 3;

    // =====================================================================
    // ENEMIES: invader formation layout and speed (colours live in PALETTES)
    // =====================================================================
    const enemies = [];
    const enemyColumns = 4; // 4 columns x 5 rows = 20 invaders
    const columnSpacing = 64;
    const rowSpacing = 50;
    const enemySpeed = 2;
    let enemyDirection = 1; // Whole formation moves together: 1 = right, -1 = left
    // Invader type for each row, top to bottom (like the arcade game)
    const rowTypes = ['squid', 'crab', 'crab', 'octopus', 'octopus'];

    const enemyDrop = 20; // How far enemies move down each time they hit an edge

    // Build a fresh wave of invaders in a grid at the top of the screen
    function spawnEnemies() {
      enemies.length = 0;
      enemyDirection = 1;
      const widestInvader = SPRITES.octopus[0].width; // Octopus is the widest sprite
      for (let row = 0; row < rowTypes.length; row++) {
        const type = rowTypes[row];
        const width = SPRITES[type][0].width;
        for (let col = 0; col < enemyColumns; col++) {
          enemies.push({
            type: type,
            // Center narrower invaders in their column so the grid lines up
            x: 50 + col * columnSpacing + (widestInvader - width) / 2,
            y: 50 + row * rowSpacing,
            width: width,
            height: SPRITES[type][0].height,
            row: row,
          });
        }
      }
    }
    spawnEnemies();

    // =====================================================================
    // SHIELDS: 3 destructible bunkers the ship can hide behind
    // =====================================================================
    // Each 'X' is one breakable block, PIXEL x PIXEL in size
    const SHIELD_SHAPE = [
      '....XXXXXXXXXXXXXX....',
      '...XXXXXXXXXXXXXXXX...',
      '..XXXXXXXXXXXXXXXXXX..',
      '.XXXXXXXXXXXXXXXXXXXX.',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXXXXXXXXXXXXXXXXX',
      'XXXXXXX........XXXXXXX',
      'XXXXXX..........XXXXXX',
      'XXXXX............XXXXX',
      'XXXXX............XXXXX',
    ];
    const shieldCount = 3;
    const shieldY = canvas.height - 150; // Just above the player's ship
    const shieldColor = '#1fbf3f';
    const shieldEdgeColor = '#8dff8d'; // Lit top edge of each block
    const shields = [];

    // Build fresh, undamaged shields spread evenly across the screen
    function spawnShields() {
      shields.length = 0;
      const width = SHIELD_SHAPE[0].length * PIXEL;
      for (let i = 0; i < shieldCount; i++) {
        const centreX = (canvas.width * (i + 1)) / (shieldCount + 1);
        shields.push({
          x: Math.round(centreX - width / 2),
          y: shieldY,
          width: width,
          height: SHIELD_SHAPE.length * PIXEL,
          // true = block still standing, false = blown away
          cells: SHIELD_SHAPE.map(row => row.split('').map(c => c === 'X')),
        });
      }
    }
    spawnShields();

    // Work out which shield blocks a rectangle overlaps (null if none)
    function shieldCellRange(shield, rect) {
      if (
        rect.x >= shield.x + shield.width ||
        rect.x + rect.width <= shield.x ||
        rect.y >= shield.y + shield.height ||
        rect.y + rect.height <= shield.y
      ) {
        return null;
      }
      return {
        firstCol: Math.max(0, Math.floor((rect.x - shield.x) / PIXEL)),
        lastCol: Math.min(shield.cells[0].length - 1, Math.floor((rect.x + rect.width - 1 - shield.x) / PIXEL)),
        firstRow: Math.max(0, Math.floor((rect.y - shield.y) / PIXEL)),
        lastRow: Math.min(shield.cells.length - 1, Math.floor((rect.y + rect.height - 1 - shield.y) / PIXEL)),
      };
    }

    // Blow a ragged hole in a shield around the block that was hit
    function damageShield(shield, row, col) {
      for (let dr = -2; dr <= 2; dr++) {
        for (let dc = -2; dc <= 2; dc++) {
          const r = row + dr;
          const c = col + dc;
          if (r < 0 || r >= shield.cells.length || c < 0 || c >= shield.cells[0].length) {
            continue;
          }
          // Always clear the centre, randomly clear the edges
          if (Math.abs(dr) + Math.abs(dc) <= 1 || Math.random() < 0.5) {
            shield.cells[r][c] = false;
          }
        }
      }
    }

    // Returns true if a bullet hit a standing block (and damages the shield)
    function bulletHitsShield(bullet) {
      for (const shield of shields) {
        const range = shieldCellRange(shield, bullet);
        if (!range) {
          continue;
        }
        for (let r = range.firstRow; r <= range.lastRow; r++) {
          for (let c = range.firstCol; c <= range.lastCol; c++) {
            if (shield.cells[r][c]) {
              damageShield(shield, r, c);
              return true;
            }
          }
        }
      }
      return false;
    }

    // Invaders marching through a shield wipe out the blocks they touch
    function invaderErodesShields(enemy) {
      shields.forEach(shield => {
        const range = shieldCellRange(shield, enemy);
        if (!range) {
          return;
        }
        for (let r = range.firstRow; r <= range.lastRow; r++) {
          for (let c = range.firstCol; c <= range.lastCol; c++) {
            shield.cells[r][c] = false;
          }
        }
      });
    }

    // =====================================================================
    // SCORE, LIVES AND HUD
    // =====================================================================
    let score = 0;
    let gameOver = false;

    // Lives
    const startingLives = 3;
    let lives = startingLives;

    // Sound on/off (toggled with the M key)
    let muted = false;

    // Refresh the score/lives text in the top-left corner
    function updateHud() {
      scoreElement.innerText = `Score: ${score}   Lives: ${lives}   Sound: ${muted ? 'off' : 'on'} (M)`;
    }
    updateHud();

    // =====================================================================
    // SOUND: arcade-style effects synthesised with the Web Audio API
    // =====================================================================
    // Browsers only allow audio after the player presses a key, so the
    // audio context is created on the first keydown
    let audioCtx = null;
    let noiseBuffer = null;

    // The famous 4-note descending bass march
    const marchNotes = [98, 87, 78, 73];
    let marchStep = 0;
    let marchTimer = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // One second of white noise, reused for every explosion
        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function soundReady() {
      return audioCtx && !muted;
    }

    // Play a tone that slides from startFreq to endFreq, then fades out
    function playTone(type, startFreq, endFreq, duration, volume) {
      if (!soundReady()) {
        return;
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Play a burst of filtered noise (explosions)
    function playNoise(duration, filterFreq, volume) {
      if (!soundReady()) {
        return;
      }
      const now = audioCtx.currentTime;
      const source = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      source.buffer = noiseBuffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + duration);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      source.connect(filter).connect(gain).connect(audioCtx.destination);
      source.start(now);
      source.stop(now + duration);
    }

    function playShootSound() {
      playTone('square', 1400, 300, 0.15, 0.08);
    }

    function playInvaderKilledSound() {
      playNoise(0.25, 4000, 0.3);
      playTone('square', 600, 100, 0.2, 0.06);
    }

    function playPlayerHitSound() {
      playNoise(0.9, 2000, 0.45);
    }

    // Step the march: the fewer invaders left, the faster the beat
    function updateMarch() {
      marchTimer++;
      const interval = Math.max(8, Math.round(10 + enemies.length * 2));
      if (marchTimer >= interval) {
        marchTimer = 0;
        playTone('square', marchNotes[marchStep], marchNotes[marchStep] * 0.9, 0.12, 0.2);
        marchStep = (marchStep + 1) % marchNotes.length;
      }
    }

    // =====================================================================
    // KEYBOARD INPUT: remember which keys are currently held down
    // =====================================================================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      // M toggles sound on/off
      if (e.code === 'KeyM' && !e.repeat) {
        muted = !muted;
        updateHud();
      }
      keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // =====================================================================
    // PLAYER CONTROLS: arrow keys move the ship, Space fires
    // =====================================================================
    // Move the ship left/right and keep it on screen
    function movePlayer() {
      if (keys['ArrowLeft']) {
        player.dx = -player.speed;
      } else if (keys['ArrowRight']) {
        player.dx = player.speed;
      } else {
        player.dx = 0;
      }

      player.x += player.dx;
      // Keep the ship on screen
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    }

    // Fire one bullet per Space press from the ship's nose
    function fireBullet() {
      if (keys['Space']) {
        bullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y,
          width: 4,
          height: 10,
        });
        playShootSound();
        keys['Space'] = false;
      }
    }

    // =====================================================================
    // ENEMY MOVEMENT: march side to side, drop at edges, respawn when cleared
    // =====================================================================
    function moveEnemies() {
      // Move the whole formation sideways
      let hitEdge = false;
      enemies.forEach(enemy => {
        enemy.x += enemySpeed * enemyDirection;
        if (enemy.x < 0 || enemy.x + enemy.width > canvas.width) {
          hitEdge = true;
        }
      });

      // If any invader touched an edge, step everyone back, turn around and drop down
      if (hitEdge) {
        enemies.forEach(enemy => {
          enemy.x -= enemySpeed * enemyDirection;
          enemy.y += enemyDrop;
        });
        enemyDirection *= -1;
      }

      enemies.forEach(enemy => {
        invaderErodesShields(enemy);

        // Game over if an enemy reaches the player's row
        if (enemy.y + enemy.height >= player.y) {
          gameOver = true;
          gameOverElement.style.display = 'block';
        }
      });

      // Send a new wave once every enemy is destroyed
      if (enemies.length === 0) {
        spawnEnemies();
      }
    }

    // =====================================================================
    // BULLET MOVEMENT AND ENEMY FIRE
    // =====================================================================
    // Move player bullets up and remove any that leave the screen
    function shootBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bulletSpeed;
        if (bullets[i].y < 0 || bulletHitsShield(bullets[i])) {
          bullets.splice(i, 1);
        }
      }
    }

    // Enemies fire back: a random column's lowest invader drops a bullet
    function enemyFire() {
      if (enemies.length === 0 || enemyBullets.length >= maxEnemyBullets) {
        return;
      }
      if (Math.random() > enemyFireChance) {
        return;
      }

      const shooter = enemies[Math.floor(Math.random() * enemies.length)];
      // Only the lowest invader in that column can shoot
      const lowest = enemies.reduce((low, enemy) => {
        const sameColumn = Math.abs(enemy.x + enemy.width / 2 - (shooter.x + shooter.width / 2)) < columnSpacing / 2;
        return sameColumn && enemy.y > low.y ? enemy : low;
      }, shooter);

      enemyBullets.push({
        x: lowest.x + lowest.width / 2 - 2,
        y: lowest.y + lowest.height,
        width: 4,
        height: 10,
      });
    }

    // Move enemy bullets down and remove any that leave the screen
    function moveEnemyBullets() {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].y += enemyBulletSpeed;
        if (enemyBullets[i].y > canvas.height || bulletHitsShield(enemyBullets[i])) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    // =====================================================================
    // COLLISIONS: bullets vs. player, bullets vs. invaders, invaders vs. player
    // =====================================================================
    // Check if an enemy bullet hits the player (lose a life)
    function checkPlayerHit() {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        if (
          bullet.x < player.x + player.width &&
          bullet.x + bullet.width > player.x &&
          bullet.y < player.y + player.height &&
          bullet.y + bullet.height > player.y
        ) {
          lives--;
          updateHud();
          playPlayerHitSound();
          // Clear incoming fire and recentre the ship
          enemyBullets.length = 0;
          player.x = canvas.width / 2 - player.width / 2;
          if (lives <= 0) {
            gameOver = true;
            gameOverElement.style.display = 'block';
          }
          return;
        }
      }
    }

    // Check collision between player and enemies
    function checkCollision() {
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          gameOver = true;
          gameOverElement.style.display = 'block';
        }

        // Check if any bullet hits the enemy
        for (let j = 0; j < bullets.length; j++) {
          const bullet = bullets[j];
          if (
            bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y
          ) {
            // Hit enemy
            score += 10;
            updateHud();
            playInvaderKilledSound();
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            i--; // The next enemy shifted into this slot; don't skip it
            break;
          }
        }
      }
    }

    // =====================================================================
    // DRAWING: paint the player, bullets and invaders onto the canvas
    // =====================================================================
    function drawPlayer() {
      drawSprite(SPRITES.player, player.x, player.y);
    }

    // Draw a bullet as a coloured glow with a bright core down the middle
    function drawGlowingBullet(bullet, glowColor, coreColor) {
      ctx.fillStyle = glowColor;
      ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      ctx.fillStyle = coreColor;
      ctx.fillRect(bullet.x + 1, bullet.y + 1, bullet.width - 2, bullet.height - 2);
    }

    // Player shots: cyan laser with a white core
    function drawBullets() {
      bullets.forEach(bullet => drawGlowingBullet(bullet, '#33ccff', '#ffffff'));
    }

    // Shield blocks with a lit top edge wherever the block above is gone
    function drawShields() {
      shields.forEach(shield => {
        shield.cells.forEach((row, r) => {
          row.forEach((standing, c) => {
            if (standing) {
              const topEdge = r === 0 || !shield.cells[r - 1][c];
              ctx.fillStyle = topEdge ? shieldEdgeColor : shieldColor;
              ctx.fillRect(shield.x + c * PIXEL, shield.y + r * PIXEL, PIXEL, PIXEL);
            }
          });
        });
      });
    }

    // Enemy shots: red with a hot yellow core
    function drawEnemyBullets() {
      enemyBullets.forEach(bullet => drawGlowingBullet(bullet, '#ff3344', '#ffdd55'));
    }

    function drawEnemies() {
      const frame = Math.floor(frameCount / animationSpeed) % 2;
      enemies.forEach(enemy => {
        drawSprite(SPRITES[enemy.type][frame], enemy.x, enemy.y);
      });
    }

    // Not currently used: the score and game over text are HTML elements instead
    function drawScore() {
      ctx.fillStyle = 'white';
      ctx.font = '20px Arial';
      ctx.fillText(`Score: ${score}`, 10, 30);
    }

    function drawGameOver() {
      ctx.fillStyle = 'red';
      ctx.font = '30px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2 - 100, canvas.height / 2);
    }

    // =====================================================================
    // GAME LOOP: runs every frame - update everything, then draw it
    // =====================================================================
    function gameLoop() {
      if (gameOver) {
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      moveBackground();
      drawBackground();
      moveStars();
      drawStars();
      drawHorizon();

      movePlayer();
      fireBullet();
      moveEnemies();
      updateMarch();
      shootBullets();
      enemyFire();
      moveEnemyBullets();
      checkCollision();
      checkPlayerHit();

      drawShields();
      drawPlayer();
      drawBullets();
      drawEnemyBullets();
      drawEnemies();

      requestAnimationFrame(gameLoop);
    }

    // Start game
    gameLoop();

    // =====================================================================
    // RESTART: clicking GAME OVER resets score, lives, bullets and invaders
    // =====================================================================
    gameOverElement.addEventListener('click', () => {
      gameOver = false;
      score = 0;
      lives = startingLives;
      player.x = canvas.width / 2 - player.width / 2;
      player.dx = 0;
      bullets.length = 0;
      enemyBullets.length = 0;
      spawnEnemies();
      spawnShields();
      gameOverElement.style.display = 'none';
      updateHud();
      gameLoop();
    });
  </script>
</body>
</html>
